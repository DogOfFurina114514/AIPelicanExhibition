<!DOCTYPE html>

<head>
<style>
/* 滚动条隐藏 + 禁 tap 高亮（内联保险） */
html { scrollbar-width: none; -ms-overflow-style: none; }
html::-webkit-scrollbar, body::-webkit-scrollbar { width:0; height:0; display:none; }
* { -webkit-tap-highlight-color: transparent; }
a, button, input, select, textarea { -webkit-tap-highlight-color: transparent; }
</style>
<script>
/* 站内跳转：源页面滚动过才播放收缩→展开（v6） */
(function(){
  var KEY = 'aip_prev_scrolled';
  var DELAY = 1200;

  function playFromInternal(){
    document.documentElement.classList.add('from-internal');
    setTimeout(function(){
      document.documentElement.classList.remove('from-internal');
      if (window.scrollY > 20) {
        var topbar = document.querySelector('.topbar');
        if (topbar) topbar.classList.add('scrolled');
      }
    }, DELAY);
  }

  // 1. 读上次滚动状态，决定是否播放动画
  try {
    var perf = performance.getEntriesByType && performance.getEntriesByType('navigation')[0];
    var navType = perf ? perf.type : 'navigate';
    if (navType !== 'reload') {
      var prevScrolled = sessionStorage.getItem(KEY) === '1';
      if (prevScrolled) playFromInternal();
    }
  } catch(e){}

  // 2. 当前页面刚加载，还没滚动 → 立即重置为 '0'
  try { sessionStorage.setItem(KEY, '0'); } catch(e){}

  // 3. 实时监听滚动，更新状态
  var ticking = false;
  window.addEventListener('scroll', function(){
    if (ticking) return;
    ticking = true;
    window.requestAnimationFrame(function(){
      try {
        sessionStorage.setItem(KEY, window.scrollY > 20 ? '1' : '0');
      } catch(e){}
      ticking = false;
    });
  }, { passive: true });
})();
</script>

    (() => {
      const $ = (id) => document.getElementById(id);

      const els = {
        rearSpin: $("rear-spin"),
        frontSpin: $("front-spin"),
        clouds: $("clouds"),
        hills: $("hills"),
        trees: $("trees"),
        roadDash: $("road-dash"),

        bodyBob: $("body-bob"),
        headGroup: $("head-group"),
        fishTail: $("fish-tail"),

        crankFar: $("crank-far"),
        crankNear: $("crank-near"),
        pedalFar: $("pedal-far"),
        pedalNear: $("pedal-near"),

        legFar: $("leg-far"),
        legNear: $("leg-near"),
        kneeFar: $("knee-far"),
        kneeNear: $("knee-near"),
        footFar: $("foot-far"),
        footNear: $("foot-near"),

        armFar: $("arm-far"),
        armNearOutline: $("arm-near-outline"),
        armNear: $("arm-near"),
      };

      const state = {
        dist: 0,
        speed: 2.0,
        paused: false,
        last: performance.now(),
      };

      const BB = { x: 400, y: 365 };
      const CRANK_R = 26;

      function setLine(el, x1, y1, x2, y2) {
        el.setAttribute("x1", x1.toFixed(2));
        el.setAttribute("y1", y1.toFixed(2));
        el.setAttribute("x2", x2.toFixed(2));
        el.setAttribute("y2", y2.toFixed(2));
      }

      function solveKnee(hx, hy, fx, fy, l1, l2) {
        const dx = fx - hx;
        const dy = fy - hy;
        const rawD = Math.hypot(dx, dy) || 0.001;

        let d = rawD;
        const max = l1 + l2 - 0.1;
        const min = Math.abs(l1 - l2) + 0.1;
        d = Math.max(min, Math.min(max, d));

        const ux = dx / rawD;
        const uy = dy / rawD;

        const a = (l1 * l1 - l2 * l2 + d * d) / (2 * d);
        const h = Math.sqrt(Math.max(0, l1 * l1 - a * a));

        const px = hx + a * ux;
        const py = hy + a * uy;

        // 让膝盖朝前进方向弯曲
        const kx = px + h * uy;
        const ky = py - h * ux;

        return { x: kx, y: ky };
      }

      function armPath(sx, sy, hx, hy, sag) {
        const mx = (sx + hx) / 2;
        const my = (sy + hy) / 2 + sag;
        return `M${sx.toFixed(1)} ${sy.toFixed(1)} Q${mx.toFixed(1)} ${my.toFixed(1)} ${hx.toFixed(1)} ${hy.toFixed(1)}`;
      }

      function frame(now) {
        const dt = Math.min(0.05, (now - state.last) / 1000);
        state.last = now;

        if (!state.paused) {
          state.dist += dt * state.speed * 100;
        }

        const dist = state.dist;
        const crankAngle = dist * 0.016;
        const wheelAngle = dist / 58;
        const wheelDeg = (wheelAngle * 180) / Math.PI;

        // 车轮旋转
        els.rearSpin.setAttribute("transform", `rotate(${wheelDeg.toFixed(2)})`);
        els.frontSpin.setAttribute("transform", `rotate(${wheelDeg.toFixed(2)})`);

        // 背景视差滚动
        const treeX = -(dist % 900);
        const hillX = -((dist * 0.12) % 900);
        const cloudX = -((dist * 0.04) % 900);

        els.trees.setAttribute("transform", `translate(${treeX.toFixed(2)} 0)`);
        els.hills.setAttribute("transform", `translate(${hillX.toFixed(2)} 0)`);
        els.clouds.setAttribute("transform", `translate(${cloudX.toFixed(2)} 0)`);
        els.roadDash.setAttribute("stroke-dashoffset", (-(dist % 105)).toFixed(2));

        // 身体轻微起伏、头和小鱼摆动
        const bodyBob = Math.sin(crankAngle * 2) * 1.8;
        const headAngle = Math.sin(crankAngle + 0.4) * 2.8;
        const fishWag = Math.sin(crankAngle * 3 + 1.0) * 18;

        els.bodyBob.setAttribute("transform", `translate(0 ${bodyBob.toFixed(2)})`);
        els.headGroup.setAttribute("transform", `rotate(${headAngle.toFixed(2)} 372 218)`);
        els.fishTail.setAttribute("transform", `translate(590 163) rotate(${fishWag.toFixed(2)})`);

        // 踏板位置
        const pNear = {
          x: BB.x + CRANK_R * Math.cos(crankAngle),
          y: BB.y + CRANK_R * Math.sin(crankAngle),
        };

        const pFar = {
          x: BB.x + CRANK_R * Math.cos(crankAngle + Math.PI),
          y: BB.y + CRANK_R * Math.sin(crankAngle + Math.PI),
        };

        setLine(els.crankNear, BB.x, BB.y, pNear.x, pNear.y);
        setLine(els.crankFar, BB.x, BB.y, pFar.x, pFar.y);

        els.pedalNear.setAttribute(
          "transform",
          `translate(${pNear.x.toFixed(2)} ${pNear.y.toFixed(2)}) rotate(${(Math.sin(crankAngle) * 8).toFixed(2)})`
        );
        els.pedalFar.setAttribute(
          "transform",
          `translate(${pFar.x.toFixed(2)} ${pFar.y.toFixed(2)}) rotate(${(Math.sin(crankAngle + Math.PI) * 8).toFixed(2)})`
        );

        // 髋部位置
        const hipNear = { x: 355, y: 258 + bodyBob };
        const hipFar = { x: 347, y: 262 + bodyBob * 0.8 };

        // 近侧腿 IK
        const kneeNear = solveKnee(hipNear.x, hipNear.y, pNear.x, pNear.y, 82, 78);
        els.legNear.setAttribute(
          "points",
          `${hipNear.x.toFixed(2)},${hipNear.y.toFixed(2)} ${kneeNear.x.toFixed(2)},${kneeNear.y.toFixed(2)} ${pNear.x.toFixed(2)},${pNear.y.toFixed(2)}`
        );
        els.kneeNear.setAttribute("cx", kneeNear.x.toFixed(2));
        els.kneeNear.setAttribute("cy", kneeNear.y.toFixed(2));
        els.footNear.setAttribute(
          "transform",
          `translate(${pNear.x.toFixed(2)} ${pNear.y.toFixed(2)}) rotate(${(Math.sin(crankAngle) * 10).toFixed(2)})`
        );

        // 远侧腿 IK
        const kneeFar = solveKnee(hipFar.x, hipFar.y, pFar.x, pFar.y, 78, 74);
        els.legFar.setAttribute(
          "points",
          `${hipFar.x.toFixed(2)},${hipFar.y.toFixed(2)} ${kneeFar.x.toFixed(2)},${kneeFar.y.toFixed(2)} ${pFar.x.toFixed(2)},${pFar.y.toFixed(2)}`
        );
        els.kneeFar.setAttribute("cx", kneeFar.x.toFixed(2));
        els.kneeFar.setAttribute("cy", kneeFar.y.toFixed(2));
        els.footFar.setAttribute(
          "transform",
          `translate(${pFar.x.toFixed(2)} ${pFar.y.toFixed(2)}) rotate(${(Math.sin(crankAngle + Math.PI) * 10).toFixed(2)})`
        );

        // 翅膀/手臂：肩膀随身体动，手保持握住车把
        const farArmD = armPath(348, 218 + bodyBob, 486, 272, 20);
        const nearArmD = armPath(366, 224 + bodyBob, 492, 276, 18);

        els.armFar.setAttribute("d", farArmD);
        els.armNearOutline.setAttribute("d", nearArmD);
        els.armNear.setAttribute("d", nearArmD);

        requestAnimationFrame(frame);
      }

      const toggleBtn = $("toggle");
      const speedInput = $("speed");

      toggleBtn.addEventListener("click", () => {
        state.paused = !state.paused;
        toggleBtn.textContent = state.paused ? "播放" : "暂停";
      });

      speedInput.addEventListener("input", (e) => {
        state.speed = parseFloat(e.target.value);
      });

      // 如果系统开启减少动态效果，默认暂停
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        state.paused = true;
        toggleBtn.textContent = "播放";
      }

      requestAnimationFrame((ts) => {
        state.last = ts;
        frame(ts);
      });
    })();
  </script>
</body>
</html>
