<!DOCTYPE html>
<html lang="zh-CN" data-lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MiMo 展区 - AI 鹈鹕作品展</title>
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="../">
      <span class="brand-mark"></span>
      <span data-i18n="brand">AI 鹈鹕作品展</span>
    </a>
    <div class="lang-switch" id="langSwitch">
      <button class="lang-btn" data-lang="zh">中文</button>
      <button class="lang-btn" data-lang="en">English</button>
      <button class="lang-btn" data-lang="meme">梗语</button>
    </div>
  </div>
</header>

<main class="wrap">
  <a class="back-link" href="../" data-i18n="backToList">← 返回列表</a>

  <section class="hero">
    <h1 class="hero-title" data-i18n="mimoPageTitle">MiMo 展区</h1>
    <p class="hero-sub" data-i18n="mimoPageSub">MiMo 是小米自研的大模型系列...</p>
  </section>

  <div class="card-grid">
    <a class="card mimo" href="./MiMoV26Flash.html">
      <div class="card-head">
        <span class="avatar mimo">
          <img src="./icon.svg" alt="MiMo" class="avatar-img" 
               onload="this.style.opacity='1'; this.nextElementSibling.style.display='none';" 
               onerror="this.style.display='none';">
          <span class="avatar-fallback">M</span>
        </span>
        <span class="card-arrow">→</span>
      </div>
      <h3 class="card-name" data-i18n="mimoFlashName">MiMo-V2.6-Flash</h3>
      <p class="card-desc" data-i18n="mimoFlashDesc">全模态高效推理模型，高频调用首选。</p>
    </a>

    <a class="card mimo" href="./MiMoV26Pro.html">
      <div class="card-head">
        <span class="avatar mimo">
          <img src="./icon.svg" alt="MiMo" class="avatar-img" 
               onload="this.style.opacity='1'; this.nextElementSibling.style.display='none';" 
               onerror="this.style.display='none';">
          <span class="avatar-fallback">M</span>
        </span>
        <span class="card-arrow">→</span>
      </div>
      <h3 class="card-name" data-i18n="mimoProName">MiMo-V2.6-Pro</h3>
      <p class="card-desc" data-i18n="mimoProDesc">全模态旗舰，1T 参数 MoE，登顶开源第一。</p>
    </a>
  </div>
</main>

<footer class="footer" data-i18n="footer">纯静态站点 · 用心做鹈鹕</footer>

<script src="../assets/i18n.js"></script>
</body>
</html>
