<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑车动画</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;height:100vh;background:linear-gradient(180deg,#4DA6FF 0%,#87CEEB 45%,#B2E2FF 70%)}
.scene{position:relative;width:100%;height:100%}

/* ===== Sun ===== */
.sun{position:absolute;top:50px;right:120px;width:85px;height:85px;
  background:radial-gradient(circle at 40% 40%,#FFFDE7,#FFD54F,#FFA000);border-radius:50%;
  box-shadow:0 0 50px rgba(255,215,0,.5),0 0 100px rgba(255,165,0,.25)}

/* ===== Clouds ===== */
.cloud{position:absolute;background:rgba(255,255,255,.92);border-radius:100px}
.cloud::before,.cloud::after{content:'';position:absolute;background:inherit;border-radius:50%}
.c1{width:180px;height:55px;top:55px;animation:drift 18s linear infinite}
.c1::before{width:80px;height:65px;top:-30px;left:35px}
.c1::after{width:60px;height:50px;top:-22px;left:85px}
.c2{width:140px;height:45px;top:130px;animation:drift 22s linear infinite;animation-delay:-10s}
.c2::before{width:65px;height:55px;top:-25px;left:25px}
.c2::after{width:50px;height:42px;top:-18px;left:70px}
.c3{width:110px;height:35px;top:200px;animation:drift 26s linear infinite;animation-delay:-18s}
.c3::before{width:50px;height:40px;top:-18px;left:20px}
.c3::after{width:38px;height:32px;top:-13px;left:55px}
@keyframes drift{from{left:-260px}to{left:110vw}}

/* ===== Ground & Road ===== */
.ground{position:absolute;bottom:0;width:100%;height:32%;
  background:linear-gradient(180deg,#43A047,#388E3C 30%,#2E7D32 100%)}
.road{position:absolute;bottom:14%;width:100%;height:70px;
  background:linear-gradient(180deg,#777,#555 10%,#444 85%,#666)}
.road::before{content:'';position:absolute;top:-3px;left:0;width:100%;height:3px;background:#888}
.road::after{content:'';position:absolute;bottom:-3px;left:0;width:100%;height:3px;background:#888}
.dashes{position:absolute;bottom:calc(14% + 33px);width:200%;height:5px;
  background:repeating-linear-gradient(90deg,#FFD54F 0,#FFD54F 50px,transparent 50px,transparent 110px);
  animation:scroll 0.8s linear infinite}
@keyframes scroll{to{transform:translateX(-110px)}}

/* ===== Scenery ===== */
.scenery{position:absolute;bottom:calc(14% + 70px);width:300%;height:130px;
  animation:scroll-s 6s linear infinite}
@keyframes scroll-s{to{transform:translateX(-33.33%)}}
.tree{position:absolute;bottom:0;display:flex;flex-direction:column;align-items:center}
.tc{width:0;height:0;border-left:32px solid transparent;border-right:32px solid transparent;
  border-bottom:60px solid #2E7D32;position:relative}
.tc::after{content:'';position:absolute;top:22px;left:-32px;width:0;height:0;
  border-left:32px solid transparent;border-right:32px solid transparent;
  border-bottom:55px solid #388E3C}
.tt{width:12px;height:30px;background:#5D4037;border-radius:3px}
.bush{position:absolute;bottom:0;width:42px;height:26px;background:#2E7D32;border-radius:50% 50% 3px 3px}

/* ===== Speed Lines ===== */
.speed-lines{position:absolute;top:50%;left:6%;z-index:5}
.sl{height:3px;background:rgba(255,255,255,.5);border-radius:3px;margin-bottom:18px;
  animation:streak .35s linear infinite}
.sl:nth-child(1){width:45px;animation-delay:0s}
.sl:nth-child(2){width:65px;margin-left:-12px;animation-delay:.1s}
.sl:nth-child(3){width:38px;margin-left:8px;animation-delay:.05s}
.sl:nth-child(4){width:55px;margin-left:-4px;animation-delay:.15s}
@keyframes streak{0%{transform:translateX(15px);opacity:.6}100%{transform:translateX(-25px);opacity:0}}

/* ===== Rider ===== */
.rider{position:absolute;bottom:calc(14% + 58px);left:22%;z-index:10;
  animation:bob .32s ease-in-out infinite alternate}
@keyframes bob{
  from{transform:translateY(0) rotate(-.3deg)}
  to{transform:translateY(-4px) rotate(.3deg)}
}

/* ===== SVG Animations ===== */
.wheel{transform-box:view-box;animation:spin .4s linear infinite}
.pedals{transform-box:view-box;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.wing{transform-box:view-box;animation:flap 1.2s ease-in-out infinite alternate}
@keyframes flap{from{transform:rotate(-3deg)}to{transform:rotate(5deg)}}
.leg-b{transform-box:view-box;animation:pedB .8s ease-in-out infinite}
.leg-f{transform-box:view-box;animation:pedF .8s ease-in-out infinite}
@keyframes pedF{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}}
@keyframes pedB{0%,100%{transform:rotate(12deg)}50%{transform:rotate(-12deg)}}

/* ===== Title ===== */
.title{position:absolute;top:22px;left:50%;transform:translateX(-50%);font-size:34px;
  color:#fff;text-shadow:2px 3px 8px rgba(0,80,120,.35);letter-spacing:5px;
  z-index:20;font-weight:700;white-space:nowrap}
</style>
</head>
<body>
<div class="scene">
  <div class="title">🦩 鹈鹕骑车 🚴</div>
  <div class="sun"></div>
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
  <div class="cloud c3"></div>

  <div class="speed-lines">
    <div class="sl"></div><div class="sl"></div>
    <div class="sl"></div><div class="sl"></div>
  </div>

  <div class="scenery">
    <div class="tree" style="left:2%"><div class="tc"></div><div class="tt"></div></div>
    <div class="bush" style="left:8%"></div>
    <div class="tree" style="left:16%"><div class="tc"></div><div class="tt"></div></div>
    <div class="bush" style="left:23%"></div>
    <div class="tree" style="left:31%"><div class="tc"></div><div class="tt"></div></div>
    <div class="bush" style="left:38%"></div>
    <div class="tree" style="left:46%"><div class="tc"></div><div class="tt"></div></div>
    <div class="bush" style="left:53%"></div>
    <div class="tree" style="left:61%"><div class="tc"></div><div class="tt"></div></div>
    <div class="bush" style="left:68%"></div>
    <div class="tree" style="left:76%"><div class="tc"></div><div class="tt"></div></div>
    <div class="bush" style="left:83%"></div>
    <div class="tree" style="left:91%"><div class="tc"></div><div class="tt"></div></div>
  </div>

  <div class="ground"></div>
  <div class="road"></div>
  <div class="dashes"></div>

  <!-- Pelican Riding Bicycle -->
  <div class="rider">
    <svg width="530" height="477" viewBox="0 0 500 450" xmlns="http://www.w3.org/2000/svg">
      <!-- Shadow -->
      <ellipse cx="265" cy="438" rx="135" ry="10" fill="rgba(0,0,0,0.12)"/>

      <!-- ===== REAR WHEEL ===== -->
      <g class="wheel" style="transform-origin:165px 380px">
        <circle cx="165" cy="380" r="55" fill="none" stroke="#444" stroke-width="8"/>
        <circle cx="165" cy="380" r="48" fill="none" stroke="#888" stroke-width="2"/>
        <line x1="165" y1="332" x2="165" y2="428" stroke="#777" stroke-width="2"/>
        <line x1="122" y1="380" x2="208" y2="380" stroke="#777" stroke-width="2"/>
        <line x1="130" y1="345" x2="200" y2="415" stroke="#777" stroke-width="2"/>
        <line x1="200" y1="345" x2="130" y2="415" stroke="#777" stroke-width="2"/>
        <line x1="138" y1="336" x2="192" y2="424" stroke="#777" stroke-width="2"/>
        <line x1="192" y1="336" x2="138" y2="424" stroke="#777" stroke-width="2"/>
        <circle cx="165" cy="380" r="6" fill="#666"/>
      </g>

      <!-- ===== FRONT WHEEL ===== -->
      <g class="wheel" style="transform-origin:365px 380px">
        <circle cx="365" cy="380" r="55" fill="none" stroke="#444" stroke-width="8"/>
        <circle cx="365" cy="380" r="48" fill="none" stroke="#888" stroke-width="2"/>
        <line x1="365" y1="332" x2="365" y2="428" stroke="#777" stroke-width="2"/>
        <line x1="322" y1="380" x2="408" y2="380" stroke="#777" stroke-width="2"/>
        <line x1="330" y1="345" x2="400" y2="415" stroke="#777" stroke-width="2"/>
        <line x1="400" y1="345" x2="330" y2="415" stroke="#777" stroke-width="2"/>
        <line x1="338" y1="336" x2="392" y2="424" stroke="#777" stroke-width="2"/>
        <line x1="392" y1="336" x2="338" y2="424" stroke="#777" stroke-width="2"/>
        <circle cx="365" cy="380" r="6" fill="#666"/>
      </g>

      <!-- ===== CHAIN ===== -->
      <ellipse cx="216" cy="380" rx="52" ry="24" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="5,4" opacity=".45"/>

      <!-- ===== BIKE FRAME ===== -->
      <g stroke="#E53935" stroke-width="6" stroke-linecap="round" fill="none">
        <line x1="268" y1="380" x2="165" y2="380"/>
        <line x1="242" y1="268" x2="165" y2="380"/>
        <line x1="268" y1="380" x2="246" y2="258"/>
        <line x1="250" y1="260" x2="352" y2="260"/>
        <line x1="268" y1="380" x2="355" y2="260"/>
        <line x1="355" y1="260" x2="365" y2="380"/>
      </g>

      <!-- Head tube -->
      <line x1="350" y1="252" x2="358" y2="268" stroke="#E53935" stroke-width="9" stroke-linecap="round"/>

      <!-- ===== HANDLEBARS ===== -->
      <g stroke="#333" stroke-width="5" stroke-linecap="round" fill="none">
        <line x1="354" y1="248" x2="378" y2="236"/>
        <path d="M378 236 L398 228 M378 236 L366 223"/>
      </g>
      <line x1="396" y1="227" x2="412" y2="220" stroke="#1a1a1a" stroke-width="9" stroke-linecap="round"/>
      <line x1="366" y1="221" x2="356" y2="216" stroke="#1a1a1a" stroke-width="9" stroke-linecap="round"/>

      <!-- ===== SEAT ===== -->
      <ellipse cx="248" cy="252" rx="22" ry="7" fill="#333" stroke="#222" stroke-width="1.5"/>
      <ellipse cx="248" cy="250" rx="16" ry="4" fill="#444"/>

      <!-- ===== BACK LEG (behind body) ===== -->
      <g class="leg-b" style="transform-origin:255px 258px">
        <line x1="255" y1="258" x2="248" y2="320" stroke="#FF8C00" stroke-width="9" stroke-linecap="round"/>
        <line x1="248" y1="320" x2="242" y2="358" stroke="#FF8C00" stroke-width="7" stroke-linecap="round"/>
        <ellipse cx="242" cy="361" rx="12" ry="5" fill="#FF8C00"/>
      </g>

      <!-- ===== PEDALS ===== -->
      <g class="pedals" style="transform-origin:268px 380px">
        <circle cx="268" cy="380" r="22" fill="none" stroke="#888" stroke-width="2.5"/>
        <circle cx="268" cy="380" r="14" fill="none" stroke="#888" stroke-width="1.5"/>
        <line x1="268" y1="380" x2="292" y2="398" stroke="#777" stroke-width="5" stroke-linecap="round"/>
        <line x1="268" y1="380" x2="244" y2="362" stroke="#777" stroke-width="5" stroke-linecap="round"/>
        <rect x="286" y="394" width="18" height="6" rx="3" fill="#333"/>
        <rect x="238" y="358" width="18" height="6" rx="3" fill="#333"/>
      </g>

      <!-- ===== TAIL ===== -->
      <path d="M202 230 Q176 218 155 208 Q180 216 205 220" fill="#E8E0D0" stroke="#D5CFC5" stroke-width="1.2"/>
      <path d="M202 237 Q172 228 148 216 Q178 226 205 230" fill="#E0D8C8" stroke="#CCC5B8" stroke-width="1"/>

      <!-- ===== FAR WING (behind body) ===== -->
      <path d="M278 198 Q305 192 318 212 Q300 208 282 215" fill="#E0D8C8" stroke="#CCC5B8" stroke-width="1" opacity=".5"/>

      <!-- ===== BODY ===== -->
      <ellipse cx="258" cy="215" rx="58" ry="50" fill="#F5F0E8" stroke="#DDD5C8" stroke-width="2"/>
      <ellipse cx="265" cy="228" rx="38" ry="30" fill="#FFF8EE" opacity=".5"/>

      <!-- ===== NEAR WING ===== -->
      <g class="wing" style="transform-origin:255px 215px">
        <path d="M238 198 Q200 200 178 222 Q188 214 198 210 Q188 218 192 232 Q215 218 242 212 Q232 210 238 198" fill="#E8E0D0" stroke="#D5CFC5" stroke-width="1.2"/>
        <line x1="198" y1="212" x2="235" y2="210" stroke="#D5CFC5" stroke-width=".8" opacity=".6"/>
        <line x1="193" y1="220" x2="228" y2="217" stroke="#D5CFC5" stroke-width=".8" opacity=".6"/>
        <line x1="191" y1="227" x2="222" y2="224" stroke="#D5CFC5" stroke-width=".8" opacity=".6"/>
      </g>

      <!-- ===== FRONT LEG (in front of body) ===== -->
      <g class="leg-f" style="transform-origin:272px 258px">
        <line x1="272" y1="258" x2="282" y2="330" stroke="#FF8C00" stroke-width="9" stroke-linecap="round"/>
        <line x1="282" y1="330" x2="296" y2="398" stroke="#FF8C00" stroke-width="7" stroke-linecap="round"/>
        <ellipse cx="297" cy="401" rx="12" ry="5" fill="#FF8C00"/>
      </g>

      <!-- ===== NECK ===== -->
      <path d="M282 183 Q312 143 338 116" stroke="#F5F0E8" stroke-width="25" fill="none" stroke-linecap="round"/>
      <path d="M285 183 Q315 143 340 116" stroke="#E8E0D0" stroke-width="20" fill="none" stroke-linecap="round" opacity=".2"/>

      <!-- ===== HEAD ===== -->
      <ellipse cx="350" cy="105" rx="23" ry="21" fill="#F5F0E8" stroke="#DDD5C8" stroke-width="1.5"/>

      <!-- Eye -->
      <circle cx="358" cy="97" r="6" fill="#222"/>
      <circle cx="359.5" cy="95.5" r="2.5" fill="white"/>
      <circle cx="357" cy="94" r="1" fill="white" opacity=".8"/>
      <!-- Eyebrow -->
      <path d="M353 90 Q358 85 364 88" stroke="#999" stroke-width="1.8" fill="none" stroke-linecap="round"/>

      <!-- ===== BEAK UPPER ===== -->
      <path d="M365 98 L458 112 L458 118 L365 112 Z" fill="#FF8C00" stroke="#E07000" stroke-width="1.5" stroke-linejoin="round"/>

      <!-- ===== BEAK LOWER / POUCH ===== -->
      <path d="M365 112 C390 122 418 158 438 150 C456 142 458 118 458 118 C435 128 398 130 365 112" fill="#FFB347" stroke="#E07000" stroke-width="1.5"/>
      <path d="M372 125 Q408 148 438 133" fill="none" stroke="#E09000" stroke-width="1" opacity=".4"/>

      <!-- Beak tip -->
      <circle cx="457" cy="115" r="2" fill="#D06000"/>

      <!-- Blush -->
      <circle cx="340" cy="112" r="7" fill="#FFB6C1" opacity=".25"/>
    </svg>
  </div>
</div>
</body>
</html>
