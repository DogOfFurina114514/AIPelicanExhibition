<style>
/* 滚动条隐藏 + 禁 tap 高亮（内联保险） */
html { scrollbar-width: none; -ms-overflow-style: none; }
html::-webkit-scrollbar, body::-webkit-scrollbar { width:0; height:0; display:none; }
* { -webkit-tap-highlight-color: transparent; }
a, button, input, select, textarea { -webkit-tap-highlight-color: transparent; }
</style>
<script>
/* 站内跳转：源页面滚动过 → 首帧收缩 → 立即平滑展开（v7） */
(function(){
  var KEY = 'aip_prev_scrolled';

  function playFromInternal(){
    var html = document.documentElement;
    html.classList.add('from-internal');

    // 双 rAF：先让浏览器渲染收缩首帧，再移除类触发 transition 展开
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        html.classList.remove('from-internal');
        if (window.scrollY > 20) {
          var topbar = document.querySelector('.topbar');
          if (topbar) topbar.classList.add('scrolled');
        }
      });
    });
  }

  // 1. 读上次滚动状态，决定是否播放动画
  try {
    var perf = performance.getEntriesByType && performance.getEntriesByType('navigation')[0];
    var navType = perf ? perf.type : 'navigate';
    if (navType !== 'reload') {
      var prevScrolled = sessionStorage.getItem(KEY) === '1';
      if (prevScrolled) playFromInternal();
    }
  } catch(e){}

  // 2. 当前页面刚加载，重置为 '0'
  try { sessionStorage.setItem(KEY, '0'); } catch(e){}

  // 3. 实时监听滚动，更新状态
  var ticking = false;
  window.addEventListener('scroll', function(){
    if (ticking) return;
    ticking = true;
    window.requestAnimationFrame(function(){
      try {
        sessionStorage.setItem(KEY, window.scrollY > 20 ? '1' : '0');
      } catch(e){}
      ticking = false;
    });
  }, { passive: true });
})();
</script>

<script>
(function () {
  'use strict';

  const NS = 'http://www.w3.org/2000/svg';
  const $  = (id) => document.getElementById(id);

  /* ---------------- 元素引用 ---------------- */
  const rig         = $('rig');
  const spokesBack  = $('spokesBack');
  const spokesFront = $('spokesFront');
  const arm1        = $('arm1');
  const arm2        = $('arm2');
  const pedal1      = $('pedal1');
  const pedal2      = $('pedal2');
  const leg1        = $('leg1');
  const leg2        = $('leg2');
  const leg1Dark    = $('leg1Dark');
  const leg2Dark    = $('leg2Dark');
  const foot1       = $('foot1');
  const foot2       = $('foot2');
  const roadMarks   = $('roadMarks');
  const bushTrack   = $('bushTrack');
  const speedLines  = $('speedLines');
  const clouds      = Array.from(document.querySelectorAll('.cloud'));
  const speedInput  = $('speed');
  const speedVal    = $('speedVal');

  /* ---------------- 参数 ---------------- */
  const TAU = Math.PI * 2;

  const BB_X = 400, BB_Y = 400;      // 五通（曲柄中心）
  const CRANK_R = 30;                // 曲柄半径

  const BASE_CRANK_PERIOD = 1.25;    // 1× 速度下曲柄转一圈的秒数
  const BASE_WHEEL_PERIOD = 0.78;    // 1× 速度下车轮转一圈的秒数

  const ROAD_SPEED = 360;            // 路面虚线滚动速度 px/s
  const BUSH_SPEED = 55;             // 灌木滚动速度 px/s
  const CLOUD_RANGE = 1150;          // 云朵循环范围

  const HIP_X = 340, HIP_Y = 278;    // 髋关节
  const L1 = 78, L2 = 92;            // 大腿 / 小腿长度

  /* ---------------- 生成灌木 ---------------- */
  const bushSpots = [
    { x: 18,  y: 435, s: 1.00 },
    { x: 92,  y: 437, s: 0.72 },
    { x: 168, y: 433, s: 1.18 },
    { x: 246, y: 437, s: 0.86 }
  ];
  const BUSH_SPAN   = 300;
  const BUSH_REPEAT = 6;

  for (let i = 0; i < BUSH_REPEAT; i++) {
    bushSpots.forEach((b) => {
      const u = document.createElementNS(NS, 'use');
      u.setAttribute('href', '#bushShape');
      u.setAttributeNS('http://www.w3.org/1999/xlink', 'xlink:href', '#bushShape');
      u.setAttribute(
        'transform',
        'translate(' + (b.x + i * BUSH_SPAN) + ',' + b.y + ') scale(' + b.s + ')'
      );
      bushTrack.appendChild(u);
    });
  }

  /* ---------------- 两骨骼反向运动学 ---------------- */
  function solveIK(hx, hy, tx, ty, l1, l2, bend) {
    const dx = tx - hx;
    const dy = ty - hy;
    const d  = Math.hypot(dx, dy) || 0.001;
    const base = Math.atan2(dy, dx);

    let cosA = (d * d + l1 * l1 - l2 * l2) / (2 * d * l1);
    cosA = Math.max(-1, Math.min(1, cosA));
    const a = Math.acos(cosA);

    return [
      hx + l1 * Math.cos(base + bend * a),
      hy + l1 * Math.sin(base + bend * a)
    ];
  }

  /* ---------------- 状态 ---------------- */
  let phase   = 0;      // 累积动画相位（不受速度突变影响）
  let speed   = 1;      // 当前倍速
  let lastT   = null;

  /* ---------------- 速度滑块 ---------------- */
  speedInput.addEventListener('input', function (e) {
    speed = parseFloat(e.target.value);
    speedVal.textContent = speed.toFixed(2) + '×';
  });

  /* ---------------- 主循环 ---------------- */
  function render() {
    const p = phase;

    /* ===== 车轮旋转 ===== */
    const wheelDeg = (p / BASE_WHEEL_PERIOD) * 360;
    spokesBack .setAttribute('transform', 'rotate(' + wheelDeg + ')');
    spokesFront.setAttribute('transform', 'rotate(' + wheelDeg + ')');

    /* ===== 曲柄 ===== */
    const ca   = (p / BASE_CRANK_PERIOD) * TAU;
    const cosC = Math.cos(ca);
    const sinC = Math.sin(ca);

    const p1x = BB_X + CRANK_R * cosC;
    const p1y = BB_Y + CRANK_R * sinC;
    const p2x = BB_X - CRANK_R * cosC;
    const p2y = BB_Y - CRANK_R * sinC;

    arm1.setAttribute('x1', BB_X); arm1.setAttribute('y1', BB_Y);
    arm1.setAttribute('x2', p1x);  arm1.setAttribute('y2', p1y);
    arm2.setAttribute('x1', BB_X); arm2.setAttribute('y1', BB_Y);
    arm2.setAttribute('x2', p2x);  arm2.setAttribute('y2', p2y);

    pedal1.setAttribute('transform', 'translate(' + p1x + ',' + p1y + ')');
    pedal2.setAttribute('transform', 'translate(' + p2x + ',' + p2y + ')');

    /* ===== 双腿（IK 解算） ===== */
    const k1 = solveIK(HIP_X, HIP_Y, p1x, p1y, L1, L2, -1);
    const d1 = 'M' + HIP_X + ' ' + HIP_Y +
               ' L' + k1[0].toFixed(2) + ' ' + k1[1].toFixed(2) +
               ' L' + p1x.toFixed(2) + ' ' + p1y.toFixed(2);
    leg1Dark.setAttribute('d', d1);
    leg1.setAttribute('d', d1);

    const k2 = solveIK(HIP_X, HIP_Y, p2x, p2y, L1, L2, -1);
    const d2 = 'M' + HIP_X + ' ' + HIP_Y +
               ' L' + k2[0].toFixed(2) + ' ' + k2[1].toFixed(2) +
               ' L' + p2x.toFixed(2) + ' ' + p2y.toFixed(2);
    leg2Dark.setAttribute('d', d2);
    leg2.setAttribute('d', d2);

    /* 脚掌跟随踏板 */
    foot1.setAttribute('cx', p1x);
    foot1.setAttribute('cy', p1y - 1);
    foot2.setAttribute('cx', p2x);
    foot2.setAttribute('cy', p2y - 1);

    /* ===== 车身颠簸 ===== */
    const bob = Math.sin(ca * 2) * 2.0;
    rig.setAttribute('transform', 'translate(0,' + bob.toFixed(2) + ')');

    /* ===== 路面虚线滚动 ===== */
    roadMarks.setAttribute('stroke-dashoffset', (p * ROAD_SPEED) % 120);

    /* ===== 灌木滚动 ===== */
    const bushOff = (p * BUSH_SPEED) % BUSH_SPAN;
    bushTrack.setAttribute('transform', 'translate(' + (-bushOff).toFixed(2) + ',0)');

    /* ===== 云朵漂移 ===== */
    for (let i = 0; i < clouds.length; i++) {
      const c  = clouds[i];
      const bx = parseFloat(c.dataset.cx);
      const by = parseFloat(c.dataset.cy);
      const sp = parseFloat(c.dataset.sp);

      let x = (bx - p * sp) % CLOUD_RANGE;
      if (x < 0) x += CLOUD_RANGE;
      x -= 160;

      c.setAttribute('transform', 'translate(' + x.toFixed(2) + ',' + by + ')');
    }

    /* ===== 速度线随倍速浮现 ===== */
    const la = Math.max(0, Math.min(0.7, (speed - 0.8) / 1.6));
    speedLines.setAttribute('opacity', la.toFixed(2));
  }

  function frame(now) {
    if (lastT === null) lastT = now;

    let dt = (now - lastT) / 1000;
    lastT = now;

    // 切换标签页回来时避免相位跳跃
    if (dt > 0.1) dt = 0.1;

    phase += dt * speed;

    render();
    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
