<!DOCTYPE html>
<html lang="zh-CN" data-lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DeepSeek-V4.1-Flash - 详情</title>
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="../">
      <span class="brand-mark"></span>
      <span data-i18n="brand">AI 鹈鹕作品展</span>
    </a>
    <div class="lang-switch" id="langSwitch">
      <button class="lang-btn" data-lang="zh">中文</button>
      <button class="lang-btn" data-lang="en">English</button>
      <button class="lang-btn" data-lang="meme">梗语</button>
    </div>
  </div>
</header>

<main class="wrap">
  <a class="back-link" href="./" data-i18n="backToList">← 返回列表</a>

  <div class="detail-header">
    <div class="detail-title-row">
      <span class="avatar ds lg">
        <img src="./icon.svg" alt="DeepSeek" class="avatar-img" 
             onload="this.style.opacity='1'; this.nextElementSibling.style.display='none';" 
             onerror="this.style.display='none';">
        <span class="avatar-fallback">DS</span>
      </span>
      <h1 class="detail-title" data-i18n="dsFlashTitle">DeepSeek-V4.1-Flash</h1>
    </div>
    <div class="detail-meta">
      <div class="meta-item">
        <span class="meta-label" data-i18n="modelLabel">模型：</span>
        <span>DeepSeek-V4.1-Flash</span>
      </div>
      <div class="meta-item">
        <span class="meta-label" data-i18n="timeLabel">耗时：</span>
        <span data-time-key="dsFlash">—</span>
      </div>
      <div class="meta-item">
        <span class="meta-label" data-i18n="versionLabel">版本：</span>
        <span>Flash</span>
      </div>
    </div>
  </div>

  <div class="intro-box">
    <h3 data-i18n="introTitle">模型官方介绍</h3>
    <p data-i18n="dsFlashIntro">DeepSeek-V4.1-Flash 是 DeepSeek 全新架构系列中的轻量旗舰模型...</p>
  </div>

  <div class="score-box" data-score-key="dsFlash">
    <h3 data-i18n="scoreTitle">作品评分</h3>
    <div class="score-layout">
      <div class="score-triangle">
        <svg class="tri-svg" viewBox="0 0 260 230" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
          <defs>
            <linearGradient id="triGrad-dsFlash" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="rgba(79,70,229,0.10)"/>
              <stop offset="100%" stop-color="rgba(124,58,237,0.12)"/>
            </linearGradient>
          </defs>
          <polygon points="130,15 15,215 245,215"
                   fill="url(#triGrad-dsFlash)"
                   stroke="var(--primary)"
                   stroke-width="2"
                   stroke-linejoin="round"/>
        </svg>
        <div class="tri-point tri-top">
          <span class="tri-label" data-i18n="scoreAesthetics">美观性</span>
          <span class="tri-value" data-score="aesthetics">—</span>
        </div>
        <div class="tri-point tri-bl">
          <span class="tri-label" data-i18n="scoreSimplicity">简洁度</span>
          <span class="tri-value" data-score="simplicity">—</span>
        </div>
        <div class="tri-point tri-br">
          <span class="tri-label" data-i18n="scoreFunctionality">功能性</span>
          <span class="tri-value" data-score="functionality">—</span>
        </div>
      </div>
      <div class="score-total-side">
        <span class="total-label" data-i18n="scoreTotal">总分</span>
        <span class="total-value" data-score="total">—</span>
      </div>
    </div>
  </div>
  <div class="preview-container">
    <div class="preview-header">
      <span class="preview-dot red"></span>
      <span class="preview-dot yellow"></span>
      <span class="preview-dot green"></span>
      <span style="margin-left: 0.5rem;" data-i18n="previewLabel">作品预览</span>
    </div>
    <iframe src="./works/DeepSeekV41Flash.html" title="DeepSeek V4.1 Flash 作品" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
  </div>
</main>

<footer class="footer" data-i18n="footer">纯静态站点 · 用心做鹈鹕</footer>

<script src="../assets/data.js"></script>
<script src="../assets/i18n.js"></script>
</body>
</html>
